        <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#1d4ed8"/>
          <rect x="18" y="12" width="28" height="40" rx="3" fill="#fff"/>
          <rect x="23" y="20" width="18" height="3" rx="1.5" fill="#c7d2fe"/>

        <a class="nav-link active" href="./" data-i18n="nav.vat"></a>
      </nav>
      <div class="lang-toggle" role="group" aria-label="Kieli / Language">
        <button type="button" data-lang-toggle="fi" aria-pressed="true">FI</button>
        <button type="button" data-lang-toggle="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main class="container narrow">
    <h1 id="page-title" data-i18n="calc.title"></h1>
    <p class="lead" data-i18n="calc.lead" style="color: var(--muted); margin-top: -0.5rem;"></p>

    <section class="card">
      <div class="grid-2">
        <div class="field">
          <label for="calc-amount" data-i18n="calc.amount"></label>
          <input type="text" id="calc-amount" inputmode="decimal" placeholder="1000" autocomplete="off">
        </div>
        <div class="field">
          <span class="label-like" data-i18n="calc.dir"></span>
          <div class="seg" role="group" aria-label data-i18n-aria="calc.dir">
            <button type="button" id="dir-add" class="active" data-i18n="calc.dirAdd"></button>
            <button type="button" id="dir-remove" data-i18n="calc.dirRemove"></button>
          </div>
        </div>
      </div>
      <div class="field">
        <span class="label-like" data-i18n="calc.rate"></span>
        <div class="seg" id="rate-seg" role="group" aria-label data-i18n-aria="calc.rate">
          <button type="button" data-rate="25.5" class="active">25,5 %</button>
          <button type="button" data-rate="13.5">13,5 %</button>
          <button type="button" data-rate="10">10 %</button>
          <button type="button" data-rate="0">0 %</button>
          <button type="button" data-rate="custom" data-i18n="calc.custom"></button>
        </div>
      </div>
      <div class="field" id="custom-rate-field" hidden>
        <label for="calc-custom-rate" data-i18n="calc.customLabel"></label>
        <input type="text" id="calc-custom-rate" inputmode="decimal" placeholder="esim. 12">
      </div>
    </section>

    <section class="card result-card">
      <h2 data-i18n="calc.results"></h2>
      <div class="result-grid">
        <div class="result-item" id="res-net">
          <div class="label" data-i18n="calc.net"></div>
          <div class="value">0,00 €</div>
        </div>
        <div class="result-item" id="res-vat">
          <div class="label" data-i18n="calc.vatPart"></div>
          <div class="value">0,00 €</div>
        </div>
        <div class="result-item main" id="res-gross">
          <div class="label" data-i18n="calc.gross"></div>
          <div class="value">0,00 €</div>
        </div>
      </div>
      <p class="hint" id="calc-formula"></p>
    </section>

    <!-- MONETIZATION SLOT (below-calculator): reserved for affiliate links.
         See README § Monetization. -->

    <section class="notice" aria-labelledby="change-title">
      <h2 id="change-title" style="margin:0 0 0.4rem; font-size:1rem;" data-i18n="calc.infoTitle"></h2>
      <p style="margin:0 0 0.3rem;"><span data-i18n="calc.infoText1"></span>
        <a href="https://www.vero.fi/tietoa-verohallinnosta/uutishuone/verotuksen_muutoksia/alv-kannan-aleneminen/" target="_blank" rel="noopener" data-i18n="calc.infoLink1"></a><span data-i18n="calc.infoText2"></span>
      </p>
      <p style="margin:0;"><span data-i18n="calc.infoText3"></span>
        <a href="https://www.vero.fi/yritykset-ja-yhteisot/verot-ja-maksut/arvonlisaverotus/arvonlisaveroprosentit/" target="_blank" rel="noopener" data-i18n="calc.infoLink2"></a>.
      </p>
    </section>

    <section class="card">
      <h2 data-i18n="calc.ratesTitle"></h2>
      <div class="table-wrap">
        <table class="rate-table">
          <thead>
            <tr>
              <th scope="col" data-i18n="calc.tableRate"></th>
              <th scope="col" data-i18n="calc.tableApplies"></th>
            </tr>
          </thead>
          <tbody>
            <tr><td><strong>25,5 %</strong></td><td data-i18n="calc.tGeneral"></td></tr>
            <tr><td><strong>13,5 %</strong></td><td data-i18n="calc.tReduced"></td></tr>
            <tr><td><strong>10 %</strong></td><td data-i18n="calc.tTen"></td></tr>
            <tr><td><strong>0 %</strong></td><td data-i18n="calc.tZero"></td></tr>
          </tbody>
        </table>
      </div>
      <p class="hint"><span data-i18n="calc.tableNote"></span>
        <a href="https://www.vero.fi/yritykset-ja-yhteisot/verot-ja-maksut/arvonlisaverotus/arvonlisaveroprosentit/" target="_blank" rel="noopener">vero.fi</a>.
      </p>
